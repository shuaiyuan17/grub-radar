name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check + build + e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Local Worker secrets (throwaway keys, Apple stub)
        run: npm run dev:vars
      - name: Typecheck, lint, format, unit + Worker tests
        run: npm run check
      - name: Build (SPA + Worker)
        run: npm run build
      - name: Worker bundle + config check (wrangler deploy --dry-run)
        run: npm run deploy:dry-run
      - name: D1 migrations apply cleanly, in order
        run: |
          npm run db:migrate:local
          npx wrangler d1 migrations list grub-radar --local | tee /tmp/migrations.txt
          grep -q "No migrations to apply" /tmp/migrations.txt
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Playwright (phone + desktop, Worker + Apple stub)
        run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
