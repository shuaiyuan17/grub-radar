<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f3ea" />
    <meta
      name="description"
      content="where should we eat? saved spots, sorted by how far they are."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>grub radar</title>

    <!-- link previews (iMessage, Slack, ...): static, so crawlers see them without a
         session. Images are drawn by scripts/og-image.ts. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="grub radar" />
    <meta property="og:title" content="grub radar" />
    <meta
      property="og:description"
      content="where should we eat? a hand-drawn radar of places near you."
    />
    <meta property="og:url" content="https://grub.shuaiyuan.me/" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="zh_CN" />
    <meta property="og:image" content="https://grub.shuaiyuan.me/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="grub radar: a hand-drawn radar with rings for 10 min, 30 min, 1 hr and road trip, dotted with food, coffee and bakery spots"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="grub radar" />
    <meta
      name="twitter:description"
      content="where should we eat? a hand-drawn radar of places near you."
    />
    <meta name="twitter:image" content="https://grub.shuaiyuan.me/og.png" />
    <meta name="twitter:image:alt" content="grub radar: a hand-drawn radar of places near you" />
  </head>
  <body>
    <!-- shown until the app's first render replaces it: never a blank page -->
    <div id="root">
      <p class="note boot-note" aria-busy="true">
        <span class="boot-en">checking who you are…</span
        ><span class="boot-zh">确认一下你是谁…</span>
      </p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
